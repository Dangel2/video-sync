<!DOCTYPE html><html><head><meta charset="utf-8"><title>Watch Party</title>
<style>
body{font-family:Arial;background:#0f1115;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:12px}
.card{background:#1a1d24;border-radius:12px;padding:12px;margin:10px 0}
input,button{padding:10px;border-radius:8px;border:0} button{background:#e50914;color:#fff}
#messages{height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 12px;border-radius:14px}.left{align-self:flex-start;background:#2a2f39}.right{align-self:flex-end;background:#e50914}
.name{font-size:11px;opacity:.8} video,iframe{width:100%;height:60vh;border:0}
</style></head><body><div class="wrap">
<div id="login" class="card"><input id="usernameInput" placeholder="Nombre"><button id="joinBtn">Entrar</button></div>
<div id="app" style="display:none">
<div id="controls" class="card" style="display:none"><input id="titleInput" placeholder="Título"><input id="urlInput" placeholder="URL de video"><button id="addBtn">Agregar</button></div>
<div class="card"><div id="player"></div><div id="status"></div></div>
<div class="card"><ul id="playlist"></ul></div>
<div class="card"><div id="messages"></div><input id="chatInput"><button id="sendBtn">Enviar</button></div>
</div></div>
<script src="/socket.io/socket.io.js"></script><script src="https://www.youtube.com/iframe_api"></script><script src="script.js"></script></body></html>
