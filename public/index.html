<!DOCTYPE html>
<html>
<head>
  <title>Watch Party Pro</title>
</head>
<body>

<h2>Entrar</h2>
<input id="usernameInput" placeholder="Tu nombre">
<button id="joinBtn">Entrar</button>

<div id="app" style="display:none;">
  <h3>Playlist</h3>
  <input id="titleInput" placeholder="Título">
  <input id="urlInput" placeholder="YouTube URL">
  <button id="addBtn">Agregar</button>

  <ul id="playlist"></ul>

  <div id="player"></div>

  <h3>Chat</h3>
  <div id="messages" style="height:150px; overflow:auto;"></div>
  <input id="chatInput">
  <button id="sendBtn">Enviar</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

</body>
</html>
