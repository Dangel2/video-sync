<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ángel ❤️ Marisela</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}
.card{
width:90%;
max-width:900px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(10px);
padding:25px;
border-radius:20px;
box-shadow:0 8px 30px rgba(0,0,0,.4);
text-align:center;
}
h1{
margin:0;
font-size:2.2rem;
}
p{
opacity:.9;
}
video{
width:100%;
border-radius:15px;
margin-top:15px;
}
.heart{
font-size:2rem;
animation:pulse 1.5s infinite;
}
@keyframes pulse{
50%{transform:scale(1.15);}
}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>Engel & Marisela</h1>
<p>Miremos Película juntos y compartamos cada momento ❤️</p>

<video id="video" controls></video>
<button id="fullscreenBtn" style="margin-top:12px;padding:10px 18px;border:none;border-radius:10px;cursor:pointer;">⛶ Pantalla completa</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
