<!DOCTYPE html>
<html>
<head>
<title>Watch Party Pro</title>
<style>
body { font-family: Arial; background:#111; color:white; text-align:center;}
#app{display:none;}
input{padding:8px;margin:5px;}
button{padding:6px 10px;background:#e50914;color:white;border:none;cursor:pointer;}
#playlist li{display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #333;}
#playlist li:hover{background:#222;}
#messages{height:150px;overflow:auto;border:1px solid #333;padding:5px;}
</style>
</head>
<body>

<div id="login">
<h2>Entrar</h2>
<input id="usernameInput" placeholder="Tu nombre">
<button id="joinBtn">Entrar</button>
</div>

<div id="app">
<h2>🎬 Watch Party</h2>

<div id="controls" style="display:none;">
<input id="titleInput" placeholder="Título">
<input id="urlInput" placeholder="YouTube URL">
<button id="addBtn">Agregar</button>
</div>

<ul id="playlist"></ul>

<div id="player"></div>

<h3>Chat</h3>
<div id="messages"></div>
<input id="chatInput">
<button id="sendBtn">Enviar</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

</body>
</html>
